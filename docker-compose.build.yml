# Overlay that builds md-bug from source instead of pulling the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# It is a separate file rather than a second service because the build service
# would otherwise collide with `md-bug` on the host port — services without a
# profile are always started by `up`.

services:
  md-bug:
    image: md-bug:local
    build:
      context: .
      dockerfile: Dockerfile
      # frontend/package.json depends on standard-ts-lib as
      # "file:../../standard-ts-lib", and inside MonoParra tools/standard-ts-lib
      # is a symlink into common/ that BuildKit refuses to follow out of the
      # build context. So it is supplied as a named build context, mirroring
      # what release.sh does with --build-context. A build without this fails.
      additional_contexts:
        standard_ts_lib: ../standard-ts-lib
